[package]
name = "wedgewalks"
version = "0.1.0"
license = "MIT"
edition = "2024"

[dependencies]
osmpbf = { version = "0.3", default-features = false, features = ["zlib"] }
rstar = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
geojson = "0.24"
serde_json = "1"
rayon = "1"
csv = "1"
bincode = "1.3"
rustc-hash = "2"
flate2 = "1"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_glow = "0.36"
egui = "0.36"
ureq = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }

[package.metadata.bundle]
name = "Wedgewalks"
identifier = "net.venge.wedgewalks"
icon = ["assets/icon.png"]
short_description = "Plans days of walking round the place you sleep"
category = "Travel"
